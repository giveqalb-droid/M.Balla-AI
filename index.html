<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant Pédagogique Monsieur Balla - CEB Sénégal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-amber-50/40 text-slate-800 font-sans min-h-screen p-3 sm:p-6">

    <!-- EN-TÊTE PRINCIPAL -->
    <header class="max-w-7xl mx-auto bg-[#5C3A21] text-amber-50 p-4 sm:p-5 rounded-2xl shadow-lg flex flex-wrap justify-between items-center gap-4 border-2 border-[#3d2514]">
        <div>
            <div class="flex items-center gap-2 flex-wrap">
                <span class="text-2xl">🎓</span>
                <h1 class="text-xl font-bold">Assistant Pédagogique Monsieur Balla</h1>
                <span class="text-[10px] bg-amber-600 px-2 py-0.5 rounded-full text-white font-semibold">CEB Sénégal • Vocal & Synthesis AI</span>
            </div>
            <p class="text-xs text-amber-200 mt-1">Gestion Prédictive de Classe & Différenciation • Maître Balla</p>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
            <!-- Contrôles Niveau & Discipline -->
            <select id="levelSelect" class="bg-[#422917] text-amber-100 text-xs font-semibold px-3 py-2 rounded-xl border border-amber-800/60 focus:outline-none">
                <option value="CI">CI (Cours Initiatique)</option>
                <option value="CP">CP (Cours Préparatoire)</option>
                <option value="CE2" selected>CE2 (Cours Élémentaire 2e)</option>
                <option value="CM2">CM2 (Cours Moyen 2e)</option>
            </select>

            <select id="subjectSelect" class="bg-[#422917] text-amber-100 text-xs font-semibold px-3 py-2 rounded-xl border border-amber-800/60 focus:outline-none">
                <option value="Maths">Mathématiques / Numération</option>
                <option value="Francais">Français / Lecture & Écriture</option>
                <option value="ESVS">Éveil / ESVS (Sciences)</option>
            </select>

            <!-- BOUTON ASSISTANCE VOCALE -->
            <button onclick="startVoiceRecognition()" id="micBtn" class="px-3 py-2 bg-amber-100 hover:bg-white text-amber-950 font-bold rounded-xl text-xs shadow flex items-center gap-1.5 transition-all">
                <span>🎤 Parler à l'Assistant</span>
            </button>
        </div>
    </header>

    <!-- ZONE RETOUR VOCAL -->
    <div id="voiceAlert" class="max-w-7xl mx-auto mt-3 hidden bg-amber-100 border border-amber-300 p-3.5 rounded-xl shadow-sm flex items-start gap-3">
        <span class="text-2xl">🔊</span>
        <div class="text-xs space-y-1">
            <p class="text-slate-600" id="transcriptText"><strong>Vous avez dit :</strong> ""</p>
            <p class="text-amber-900 font-semibold" id="aiResponseText"><strong>Réponse Vocale :</strong> Écoute active...</p>
        </div>
    </div>

    <!-- CONTENU PRINCIPAL -->
    <main class="max-w-7xl mx-auto mt-6 space-y-6">

        <!-- METRIQUES & FILTRES -->
        <section class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div onclick="filterStudents('all')" class="bg-white p-4 rounded-xl shadow-sm border-2 border-slate-200 cursor-pointer hover:border-slate-300 transition-all">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-xs font-semibold text-slate-500 uppercase">Effectif Total</p>
                        <h3 class="text-
